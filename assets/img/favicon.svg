<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- High-contrast neon gradient matching the MD3 primary/secondary theme -->
    <linearGradient id="neon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="50%" stop-color="#40A0E0" />
      <stop offset="100%" stop-color="#00E5C3" />
    </linearGradient>
    <!-- Premium dark metallic background for contrast in light/dark tabs -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2433" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>
    <!-- Drop shadow for the spade to pop out -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00E5C3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container with smooth rounded corners and a sleek border -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#bg-grad)" stroke="url(#neon-grad)" stroke-width="18" />

  <!-- Classic playing-card spade (Pica) vector path, scaled and centered for maximum visibility -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Base / Stem -->
    <path d="M256 350 C256 385 240 455 170 455 C158 455 160 466 175 466 L337 466 C352 466 354 455 342 455 C272 455 256 385 256 350 Z" fill="url(#neon-grad)" />
    <!-- Spade Main Body -->
    <path d="M256 46 C242 46 100 216 100 316 C100 390 160 450 236 450 C245 450 256 448 256 448 C256 448 267 450 276 450 C352 450 412 390 412 316 C412 216 270 46 256 46 Z" fill="url(#neon-grad)" />
  </g>
</svg>
