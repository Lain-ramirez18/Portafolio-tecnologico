<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid, uniform pure black background -->
  <rect width="512" height="512" fill="#000000" />
  
  <g>
    <!-- Connecting Digital Lines (Perfectly aligned to pixel grid for 32x32 rendering) -->
    <line x1="128" y1="128" x2="384" y2="128" stroke="#00E5FF" stroke-width="32" stroke-linecap="round" />
    <line x1="128" y1="384" x2="384" y2="384" stroke="#00E5FF" stroke-width="32" stroke-linecap="round" />
    <line x1="128" y1="128" x2="384" y2="384" stroke="#00E5FF" stroke-width="32" stroke-linecap="round" />
    <line x1="128" y1="384" x2="384" y2="128" stroke="#00E5FF" stroke-width="32" stroke-linecap="round" />
  </g>
  
  <g>
    <!-- Interconnected Nodes (Cyan rings with pure black center masks) -->
    <circle cx="128" cy="128" r="32" fill="#000000" stroke="#00E5FF" stroke-width="32" />
    <circle cx="384" cy="128" r="32" fill="#000000" stroke="#00E5FF" stroke-width="32" />
    <circle cx="128" cy="384" r="32" fill="#000000" stroke="#00E5FF" stroke-width="32" />
    <circle cx="384" cy="384" r="32" fill="#000000" stroke="#00E5FF" stroke-width="32" />
  </g>
</svg>
